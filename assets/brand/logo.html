<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; }
  body {
    font-family: 'Archivo', sans-serif;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(600px 400px at 50% -10%, rgba(116,182,232,.35) 0%, transparent 60%),
      linear-gradient(180deg, #123a6b 0%, #1a4f8a 40%, #3a7fc4 68%, #74b6e8 82%, #dcebf7 100%);
    overflow: hidden;
  }
  .card { text-align: center; }
  .mat {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal; line-height: 1; display: inline-block;
    font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
  }
  .medallion {
    width: 150px; height: 150px; margin: 0 auto; border-radius: 50%;
    background: linear-gradient(180deg, #fce184, #d4af37 55%, #755000);
    padding: 5px; box-shadow: 0 0 34px rgba(232,179,58,.55);
  }
  .medallion-in {
    width: 100%; height: 100%; border-radius: 50%; background: #0b101c;
    border: 3px solid #5a4209; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .medallion-in .mat { color: #f6d77a; font-size: 96px; }
  .cinta {
    position: absolute; bottom: 0; left: 0; right: 0; height: 14px;
    background: linear-gradient(180deg, #74b7e8 0%, #74b7e8 32%, #ffffff 33%, #ffffff 66%, #74b7e8 67%, #74b7e8 100%);
  }
  .title {
    font-weight: 900; letter-spacing: 2px; line-height: 1.02; margin-top: 22px; font-size: 34px;
    background: linear-gradient(180deg, #eef4fb 0%, #a8d4f2 40%, #74b6e8 75%, #4a90c8 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.55));
  }
  .tag {
    display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 5px;
    background: linear-gradient(90deg, #8b1111, #b71c1c); color: #ffd8d8;
    font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid rgba(255,107,107,.4);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="medallion">
      <div class="medallion-in">
        <span class="mat">wb_sunny</span>
        <div class="cinta"></div>
      </div>
    </div>
    <h1 class="title">LA TOMA DEL<br/>CONURBANO</h1>
    <div class="tag">Edición Beligerante</div>
  </div>
</body>
</html>
