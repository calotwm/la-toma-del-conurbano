<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(600px 400px at 50% -10%, rgba(116,182,232,.35) 0%, transparent 60%),
      linear-gradient(180deg, #123a6b 0%, #1a4f8a 40%, #3a7fc4 68%, #74b6e8 82%, #dcebf7 100%);
    overflow: hidden;
  }
  .medallion {
    width: 240px; height: 240px; border-radius: 50%;
    background: linear-gradient(180deg, #fce184, #d4af37 55%, #755000);
    padding: 8px; box-shadow: 0 0 46px rgba(232,179,58,.6);
  }
  .medallion-in {
    width: 100%; height: 100%; border-radius: 50%; background: #0b101c;
    border: 4px solid #5a4209; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .cinta {
    position: absolute; bottom: 0; left: 0; right: 0; height: 20px;
    background: linear-gradient(180deg, #74b7e8 0%, #74b7e8 32%, #ffffff 33%, #ffffff 66%, #74b7e8 67%, #74b7e8 100%);
  }
</style>
</head>
<body>
  <div class="medallion">
    <div class="medallion-in">
      <!-- sol dibujado a mano en SVG (sin fuente de íconos externa: nada que dependa de red) -->
      <svg width="150" height="150" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="#f6d77a">
        <circle cx="50" cy="50" r="21"/>
        <!-- 8 rayos: mismo rombo apuntando hacia arriba, rotado alrededor del centro (50,50) -->
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(0 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(45 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(90 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(135 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(180 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(225 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(270 50 50)"/>
        <polygon points="50,3 56,15 50,27 44,15" transform="rotate(315 50 50)"/>
      </svg>
      <div class="cinta"></div>
    </div>
  </div>
</body>
</html>
