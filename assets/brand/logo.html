<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<style>
  /* fuente local (bajada del mismo Material Symbols Outlined que usa el juego) en vez de
     depender de que cargue desde Google Fonts al renderizar */
  @font-face {
    font-family: 'Material Symbols Outlined';
    src: url('./MaterialSymbolsOutlined.ttf') format('truetype');
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(600px 400px at 50% -10%, rgba(116,182,232,.35) 0%, transparent 60%),
      linear-gradient(180deg, #123a6b 0%, #1a4f8a 40%, #3a7fc4 68%, #74b6e8 82%, #dcebf7 100%);
    overflow: hidden;
  }
  .mat {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal; line-height: 1; display: inline-block;
    font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
  }
  .medallion {
    width: 240px; height: 240px; border-radius: 50%;
    background: linear-gradient(180deg, #fce184, #d4af37 55%, #755000);
    padding: 8px; box-shadow: 0 0 46px rgba(232,179,58,.6);
  }
  .medallion-in {
    width: 100%; height: 100%; border-radius: 50%; background: #0b101c;
    border: 4px solid #5a4209; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .medallion-in .mat { color: #f6d77a; font-size: 150px; }
  .cinta {
    position: absolute; bottom: 0; left: 0; right: 0; height: 20px;
    background: linear-gradient(180deg, #74b7e8 0%, #74b7e8 32%, #ffffff 33%, #ffffff 66%, #74b7e8 67%, #74b7e8 100%);
  }
</style>
</head>
<body>
  <div class="medallion">
    <div class="medallion-in">
      <span class="mat">wb_sunny</span>
      <div class="cinta"></div>
    </div>
  </div>
</body>
</html>
